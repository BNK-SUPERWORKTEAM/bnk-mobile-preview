<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BNK Integrated Page</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&family=Noto+Sans+SC:wght@400;500&display=swap">
<style>
/* ===========================================================
   피그마 통합페이지(1920x1080) 기준.
   가로 = vw 비율 / 세로 = % 비율 / 요소 크기 = --s 배율
   스크롤 순서: 피더린 -> 바루랩 -> 탐뷰티
   =========================================================== */
:root{
  --s:1;                       /* min(vw/1920, vh/1080) — JS가 설정 */
  --sm:1;                      /* 모바일 전용 배율: innerWidth/430 — JS가 설정 */
  --e-expo:cubic-bezier(.16,1,.3,1);
  --e-quart:cubic-bezier(.76,0,.24,1);
  --e-soft:cubic-bezier(.22,.85,.28,1);
  --d-panel:950ms;
  --d-cover:900ms;

  --t-logo:300ms;  --step-logo:3ms;
  --t-desc:640ms;  --step-char:14ms;
  --t-cta:1060ms;

  --w-active:66.927vw;   /* 1285/1920 */
  --w-peek:33.073vw;     /*  635/1920 */
  --w-cover:50vw;        /*  960/1920 */
  --w-frame:calc(var(--w-active) + 1px);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#fff;overflow:hidden}
/* 언어별 본문 고딕 — 모두 Pretendard 계열의 가독성 좋은 산세리프 */
body{font-family:var(--font);-webkit-font-smoothing:antialiased}
:root{--font:Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
html[lang="ja"]{--font:'Noto Sans JP',Pretendard,'Hiragino Sans','Yu Gothic',sans-serif}
html[lang="zh"]{--font:'Noto Sans SC',Pretendard,'PingFang SC','Microsoft YaHei',sans-serif}
img,video{display:block}
a{color:inherit;text-decoration:none}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

.stage{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;background:#fff;overflow:hidden}
.slider{position:absolute;inset:0}
.panel{
  position:absolute;left:0;top:0;height:100%;
  width:var(--wf, var(--w-frame));
  transform:translateX(var(--x));
  background:var(--bg);overflow:hidden;
  opacity:1;
  transition:transform 1250ms var(--e-soft),opacity 760ms linear;
  will-change:transform,opacity;
}
/* 이미지 밴드 — 2중 구조.
   .fill : 프레임 전폭. 전환 중 .crop 폭이 한 프레임 늦어도 같은 사진이 깔려 있어
           빈 여백(브랜드 색)이 절대 드러나지 않는다.
   .crop : 피그마 실측 사진 박스(600x450 / 240x300 / 120x240 / 635x586 / 1285x723).
           이 박스 비율이 곧 사진 비율이므로 피그마와 동일하게 보인다. */
.band{
  position:absolute;left:0;width:100%;
  top:var(--by);height:var(--bh);
  background:#C4C4C4;overflow:hidden;
  transition:top var(--d-panel) var(--e-expo),
             height var(--d-panel) var(--e-expo);
}
.band .fill{
  position:absolute;inset:0;
  background-image:var(--shot);background-size:cover;
  background-position:var(--opx,50%) var(--opy,50%);
}
.band .crop{
  position:absolute;left:0;top:0;height:100%;width:var(--bw);overflow:hidden;
  transition:width var(--d-panel) var(--e-expo);
}
.band .crop>*{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:var(--opx,50%) var(--opy,50%);
  transition:object-position var(--d-panel) var(--e-expo),opacity 420ms linear;
}
/* 탐뷰티: 이미지 10장이 아래에서 위로 올라오며 교체되는 무한 롤 */
.band .crop .roll{
  position:absolute;left:0;top:0;width:100%;height:100%;
  display:flex;flex-direction:column;will-change:transform;
}
.band .crop .main{overflow:hidden}
.band .crop .roll img{
  position:static;flex:none;width:100%;height:100%;
  object-fit:cover;object-position:50% var(--opy,50%);
}

/* 피더린만 사진(peek)과 영상(활성)이 다르므로 교차 전환 */
.panel.has-alt .main{opacity:0}
.panel.has-alt.is-active .main{opacity:1}
.panel.has-alt.is-active .alt{opacity:0}

/* 쌓임 순서: 바닥(흰색) < 브랜드 바 < 컬럼 이미지 < 원래 이미지
   -> 브랜드 바가 위로 올라가면 원래 이미지 뒤로 가려진다 */
.floor{position:absolute;inset:0;background:#fff;opacity:var(--fo,0);z-index:0}
.band{z-index:3}
.ext{position:absolute;left:0;width:100%;overflow:hidden;background:#C4C4C4;z-index:1}
.ext img{width:100%;height:100%;object-fit:cover;object-position:50% var(--oy,50%)}
/* 브랜드 바 — 색·로고·문구·버튼 한 덩어리. 변형 중엔 통째로 위로 올라가 가려진다 */
.label{
  position:absolute;left:0;width:100%;z-index:2;
  display:block;color:inherit;text-decoration:none;cursor:pointer;pointer-events:none;
  top:var(--bar-top,66.944%);height:var(--bar-h,33.056%);
  background:var(--bg);
  transform:translateY(var(--ly,0px));
}

/* 변형 중에는 트랜지션을 끈다 — 매 프레임 값을 직접 쓰므로
   트랜지션이 걸려 있으면 밴드만 950ms 뒤처져 이미지 사이가 벌어진다 */
.panel.morphing,
.panel.morphing .band,
.panel.morphing .band .crop,
.panel.morphing .band img,
.panel.morphing .band video,
.panel.morphing .ext,
.panel.morphing .label{transition:none!important}

/* ---------- 로고: 64조각 파도 ----------
   마스크는 로고 박스 하나만. 조각은 clip-path로 좌우만 잘라
   세로는 자유롭게 흐르므로 조각별 잘린 가장자리(계단)가 없다. */
.logo{position:absolute;display:flex;align-items:flex-end;overflow:hidden;--n:64;
      background-repeat:no-repeat;background-size:100% 100%}
/* 파도가 끝나면 조각을 감추고 원본 이미지 한 장으로 교체 —
   조각 경계(소수점 반올림으로 생기는 세로 줄)가 정지 상태에서 보이지 않게 */
.logo.settled{background-image:var(--src)}
.logo.settled .sl{visibility:hidden}
.logo .sl{width:calc(100% / var(--n));height:100%;flex:none;clip-path:inset(-300% 0 -300% 0)}
.logo .sl i{
  display:block;height:100%;
  width:calc(100% * var(--n));
  margin-left:calc(var(--i) * -100%);
  background-repeat:no-repeat;background-size:100% 100%;
  transform:translateY(100%);opacity:0;
  transition:transform 840ms var(--e-soft),opacity 300ms linear;
}
.panel.is-active .logo .sl i{
  transform:none;opacity:1;
  transition-delay:calc(var(--t-logo) + var(--i) * var(--step-logo));
}

/* ---------- 문구: 글자 단위 파도 ---------- */
.desc{
  position:absolute;top:calc(72 * var(--s) * 1px);
  font-size:calc(22 * var(--s) * 1px);
  line-height:calc(32 * var(--s) * 1px);
  letter-spacing:calc(-0.44 * var(--s) * 1px);
  font-weight:400;white-space:nowrap;
}
.desc .w,
.s4 .w{white-space:nowrap}
.desc .ch{
  display:inline-block;
  transform:translateY(.62em);opacity:0;
  transition:transform 760ms var(--e-soft),opacity 380ms linear;
}
.panel.is-active .desc .ch{
  transform:none;opacity:1;
  transition-delay:calc(var(--t-desc) + var(--i) * var(--step-char));
}

/* ---------- 브랜드별 실측값 ---------- */
.b-pyderin .logo{left:calc(112 * var(--s) * 1px);bottom:calc(144 * var(--s) * 1px);
                 width:calc(531 * var(--s) * 1px);height:calc(153 * var(--s) * 1px)}
.b-pyderin .desc{left:calc(682 * var(--s) * 1px);color:#fff}

.b-barulab .logo{left:calc(121 * var(--s) * 1px);bottom:calc(196 * var(--s) * 1px);
                 width:calc(596 * var(--s) * 1px);height:calc(82  * var(--s) * 1px)}
.b-barulab .desc{left:calc(769 * var(--s) * 1px);color:#000}
.b-tam .logo{left:calc(120 * var(--s) * 1px);bottom:calc(120 * var(--s) * 1px);
             width:calc(439 * var(--s) * 1px);height:calc(204 * var(--s) * 1px)}
.b-tam .desc{left:calc(615 * var(--s) * 1px);color:#fff}

/* 바루랩은 문구가 길어 3줄 고정 — 2줄로 펴면 오른쪽 여백이 4px밖에 안 남는다 */
.desc .b2{display:none}
.desc .b3{display:inline}

/* ---------- ↗ 버튼: 브랜드 프레임의 오른쪽 아래 모서리에 고정 ---------- */
.cta{
  position:absolute;right:1px;bottom:0;
  width:calc(150 * var(--s) * 1px);height:calc(150 * var(--s) * 1px);
  display:grid;place-items:center;
  opacity:0;transform:translateY(calc(22 * var(--s) * 1px));pointer-events:none;
  transition:opacity 520ms var(--e-soft),transform 700ms var(--e-soft);
}
.panel.is-active .label{pointer-events:auto}
.panel.is-active .cta{opacity:1;transform:none;transition-delay:var(--t-cta)}
.cta .dot{
  width:calc(90 * var(--s) * 1px);height:calc(90 * var(--s) * 1px);
  border-radius:50%;background:#fff;display:grid;place-items:center;
  transition:transform 420ms var(--e-expo);
}
.cta .dot img{
  width:calc(48 * var(--s) * 1px);height:calc(48 * var(--s) * 1px);
  transform:rotate(-90deg);
}
.panel.is-active .cta .dot img{
  transform:rotate(0deg);
  transition:transform 760ms var(--e-soft);
  transition-delay:calc(var(--t-cta) + 140ms);
}
.panel.is-active .label:hover .dot{transform:scale(1.06)}
.panel.is-active .label:hover .dot img{transform:rotate(0deg);transition-delay:0ms}

.herobar button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

/* 좌상단 — 브랜드 바로가기 */
.herobar{
  position:absolute;left:0;z-index:6;top:calc(46 * var(--s) * 1px);
  width:var(--w-frame);padding:0 calc(60 * var(--s) * 1px);
  display:flex;align-items:center;justify-content:space-between;
  z-index:6;color:#fff;
  text-shadow:0 1px 14px rgba(0,0,0,.28);
  transition:opacity 420ms var(--e-soft),transform 620ms var(--e-soft);
}
.stage.scrolled .herobar{opacity:0;transform:translateY(calc(-18 * var(--s) * 1px));pointer-events:none}
.brandnav{display:flex;gap:calc(38 * var(--s) * 1px)}
.brandnav button{
  font-size:calc(18 * var(--s) * 1px);font-weight:500;letter-spacing:-0.02em;
  white-space:nowrap;overflow:hidden;height:1.4em;
}
/* 같은 글자를 두 벌 쌓아두고 한 칸 밀어 올린다 — 위로 넘어가며 교체되는 모션 */
.brandnav button span{display:block;transition:transform 520ms var(--e-soft)}
.brandnav button i{display:block;font-style:normal;height:1.4em;line-height:1.4em}
.brandnav button:hover span{transform:translateY(-50%)}

/* 우상단 — 언어 */
.langs{display:flex;align-items:center;gap:calc(24 * var(--s) * 1px)}
.langs button{
  /* 폰트를 고정한다. --font 를 상속하면 언어를 바꿀 때마다 이 줄의
     글자 폭과 baseline 이 달라져 버튼들이 밀린다 */
  font-family:Pretendard,'Noto Sans JP','Noto Sans SC',-apple-system,sans-serif;
  font-size:calc(16 * var(--s) * 1px);font-weight:500;line-height:1.25;letter-spacing:.01em;
  color:#fff;opacity:.5;
  padding-bottom:calc(3 * var(--s) * 1px);border-bottom:1px solid transparent;
  transition:opacity 220ms ease,border-color 220ms ease;white-space:nowrap;
  display:flex;align-items:center;justify-content:center;
}
.langs button:hover{opacity:.85}
.langs button.on{opacity:1;border-bottom-color:#fff}
.langbox{position:relative;display:flex;align-items:center}
.langtoggle{display:none}
.brandnav button{position:relative}


/* ---------- 스크롤 안내 ----------
   레퍼런스 모션: 점이 떨어질 때 세로로 길게 늘어나고(stretch),
   끝에서 납작하게 뭉쳤다(squash) 원형으로 돌아온다. 빠른 구간엔 잔상. */
.cue{
  position:absolute;z-index:6;pointer-events:none;
  /* 오른쪽 끝을 언어 선택 줄과 같은 라인에 맞춘다 (패널 폭 - 좌우 여백 60) */
  left:auto;right:calc(33.073vw - 1px + 60 * var(--s) * 1px);
  /* 사진 밑 빨간 영역(723~1080) 안쪽에 위아래 38씩 여백을 두고 꽉 채운다 */
  top:calc(66.944% + 38 * var(--s) * 1px);
  bottom:calc(38 * var(--s) * 1px);
  display:flex;flex-direction:column;align-items:center;
  gap:calc(18 * var(--s) * 1px);color:#fff;
  transition:opacity 420ms var(--e-soft);
}
.stage.scrolled .cue{opacity:0}
.cue span{
  /* 상단 브랜드 내비와 같은 크기·굵기 */
  font-size:calc(18 * var(--s) * 1px);font-weight:500;
  letter-spacing:.06em;opacity:.85;text-shadow:0 1px 10px rgba(0,0,0,.3);
}
.cue i{
  position:relative;display:block;
  flex:1 1 auto;width:calc(14 * var(--s) * 1px);
}
/* 점이 지나가는 경로 표시 — 가느다란 세로선 */
.cue i::before{
  content:'';position:absolute;left:50%;top:0;bottom:0;
  width:1.5px;margin-left:-0.75px;             /* 화면 배율과 무관하게 항상 1.5px */
  border-radius:999px;background:rgba(255,255,255,.30);
}
.cue i b{
  position:absolute;left:0;top:0;
  width:calc(14 * var(--s) * 1px);height:calc(14 * var(--s) * 1px);
  border-radius:999px;background:#fff;
  transform-origin:50% 50%;
  animation:cuedot 1900ms infinite;
}
@keyframes cuedot{
  0%,8%    {transform:translateY(0) scale(1,1);filter:blur(0);
            animation-timing-function:cubic-bezier(.55,0,.85,.35)}   /* 가속 */
  30%      {transform:translateY(800%) scale(.66,1.66);filter:blur(.7px)}
  46%      {transform:translateY(1600%) scale(1.22,.8);filter:blur(0);
            animation-timing-function:cubic-bezier(.18,.9,.32,1)}    /* 착지 뭉침 */
  54%      {transform:translateY(1600%) scale(1,1);
            animation-timing-function:cubic-bezier(.55,0,.85,.35)}
  74%      {transform:translateY(800%) scale(.66,1.66);filter:blur(.7px)}
  90%      {transform:translateY(0) scale(1.18,.84);filter:blur(0);
            animation-timing-function:cubic-bezier(.18,.9,.32,1)}
  100%     {transform:translateY(0) scale(1,1)}
}
@media (prefers-reduced-motion:reduce){.cue i b{animation:none}}

/* ---------- 마지막 화면 문구 ---------- */
.s4{
  position:absolute;z-index:4;pointer-events:none;
  left:39.583vw;                       /* 컬럼(639) 오른쪽 121 */
  top:0;height:100%;width:calc(1020 * var(--s) * 1px);
  display:flex;flex-direction:column;justify-content:center;
  gap:calc(40 * var(--s) * 1px);
}
.s4-h{
  /* 어떤 언어를 선택해도 영문 그대로 */
  font-family:Pretendard,-apple-system,sans-serif;
  font-size:calc(52 * var(--s) * 1px);font-weight:500;
  line-height:1.20;letter-spacing:-0.02em;color:#111;
}
.s4-p{
  white-space:nowrap;
  font-size:calc(18 * var(--s) * 1px);line-height:calc(30 * var(--s) * 1px);
  letter-spacing:calc(-0.36 * var(--s) * 1px);color:#111;opacity:.75;
}
/* 등장 모션은 브랜드 문구와 동일한 글자 단위 파도 */
.s4 .ch{
  display:inline-block;
  transform:translateY(.62em);opacity:0;
  transition:transform 760ms var(--e-soft),opacity 380ms linear;
}
.s4.on .ch{
  transform:none;opacity:1;
  transition-delay:calc(var(--t,0ms) + var(--i) * var(--step-char));
}
.s4-h{--t:120ms}
.s4-p{--t:560ms}

/* ---------- 상단바 / 인덱스 ---------- */
.topbar{position:absolute;left:0;top:0;width:100%;z-index:25;pointer-events:none}
.topbar .menu{
  position:absolute;right:calc(40 * var(--s) * 1px);top:calc(30 * var(--s) * 1px);
  display:flex;align-items:center;
  padding:calc(17 * var(--s) * 1px) calc(34 * var(--s) * 1px);
  border-radius:999px;background:#111;color:#fff;
  font-size:calc(18 * var(--s) * 1px);font-weight:500;letter-spacing:.12em;
  cursor:pointer;white-space:nowrap;
  /* 스크롤 전에는 보이지 않는다 — 이때 pointer-events 를 켜두면 투명한 채로
     상단 오른쪽(언어 선택 토글 자리)의 탭을 가로챈다 */
  pointer-events:none;
  opacity:0;transform:translateY(-14px);
  transition:opacity 420ms var(--e-expo),transform 520ms var(--e-expo);
}
.stage.scrolled .topbar .menu{opacity:1;transform:none;transition-delay:420ms;pointer-events:auto}
.counter{
  position:absolute;right:calc(40 * var(--s) * 1px);bottom:calc(34 * var(--s) * 1px);z-index:5;
  font-size:calc(14 * var(--s) * 1px);letter-spacing:.14em;color:#111;
  opacity:0;transition:opacity 420ms var(--e-expo);
}
.stage.scrolled .counter{opacity:1;transition-delay:460ms}

/* ===========================================================
   모바일 (≤820px) — 좌우로 나란히 두던 브랜드를 위아래로 쌓는다.
   패널 내부(밴드·라벨·모프)는 전부 "패널 자기 높이" 기준 비율이라
   손대지 않아도 그대로 따라온다. 축을 90도 돌리는 부분만 새로 잡는다:
   패널 자체의 위치(translateX→Y)와 폭(항상 100%), 그리고
   로고/문구/버튼처럼 "가로 폭이 넉넉한 데스크톱 프레임" 전제로 짠
   내부 배치만 세로 스택으로 다시 짠다.
   =========================================================== */
@media (max-width:820px){
  /* 들어오는 두 장(.ext)이 브랜드 바(.label, z-index:2)보다 아래라, 바가 먼저
     비켜주지 않으면 보이지 않았다 -> 바가 빠지는 동안 그 아래가 흰 바닥으로
     드러남. 순서를 뒤집어 이미지가 바를 덮으며 내려오게 하면 빈 구간이 없다. */
  .ext{z-index:4}

  .panel{
    width:100%!important;
    height:var(--hf,100%);
    transform:translateY(calc(var(--y,0dvh) + var(--slideY,0dvh)));
  }
  .band .crop{width:100%!important}     /* 모프 중 가로로 좁아지던 것도 무효화 */
  .herobar{width:100%!important}

  /* 로고 — 브랜드마다 원래 가로세로 비율은 유지하되 작은 고정 높이로 */
  .logo{left:calc(24 * var(--sm) * 1px)!important;bottom:auto!important;
        top:calc(24 * var(--sm) * 1px)!important}   /* 화살표 버튼과 동일한 여백(24px)으로 통일 */
  .b-pyderin .logo{width:calc(125 * var(--sm) * 1px)!important;height:calc(36 * var(--sm) * 1px)!important}
  .b-barulab .logo{width:calc(230 * var(--sm) * 1px)!important;height:calc(32 * var(--sm) * 1px)!important}
  .b-tam     .logo{width:calc(100 * var(--sm) * 1px)!important;height:calc(47 * var(--sm) * 1px)!important}
  /* 문구 시작 위치 = 24(로고 여백) + 브랜드별 로고 높이 + 10(간격) —
     로고 크기가 브랜드마다 달라서 문구 위치도 그에 맞춰 따로 잡는다.
     피더린(36)은 위 .desc 기본값(70)을 그대로 쓴다. */
  .b-barulab .desc{top:calc(66 * var(--sm) * 1px)!important}
  .b-tam     .desc{top:calc(81 * var(--sm) * 1px)!important}

  /* 문구 — 로고 아래로 내려서 쌓고, 좁은 폭에 맞춰 자동 줄바꿈 */
  .desc{
    left:calc(24 * var(--sm) * 1px)!important;right:calc(24 * var(--sm) * 1px);
    top:calc(70 * var(--sm) * 1px)!important;   /* 24(로고 여백) + 36(피더린 로고 높이) + 10(간격) */
    font-size:calc(14 * var(--sm) * 1px)!important;
    line-height:calc(20 * var(--sm) * 1px)!important;
    letter-spacing:normal!important;white-space:normal!important;
  }
  .desc br.b2{display:none!important}   /* 자동 줄바꿈에 맡기므로 수동 줄바꿈은 끈다 */
  .desc br.b3{display:none!important}   /* 바루랩의 데스크톱용 3줄 강제 줄바꿈도 꺼서
                                            좁은 폭에서 자연스럽게 접히게 한다(더 짧아짐) */

  /* ↗ 버튼 — 자리(오른쪽 아래 모서리)는 그대로, 크기만 축소.
     .dot/.dot img 는 기본적으로 데스크톱 --s 를 쓰므로 놔두면 모바일에서
     거의 안 보일 만큼 작아진다 — --sm 기준으로 반드시 같이 덮어써야 한다. */
  .cta{
    width:calc(72 * var(--sm) * 1px)!important;height:calc(72 * var(--sm) * 1px)!important;
    /* 로고의 왼쪽 여백(24px)과 맞춰 안쪽으로 들여서 좌우 여백을 대칭시킨다 */
    right:calc(24 * var(--sm) * 1px)!important;bottom:calc(24 * var(--sm) * 1px)!important;
  }
  .cta .dot{width:calc(52 * var(--sm) * 1px)!important;height:calc(52 * var(--sm) * 1px)!important}
  .cta .dot img{width:calc(26 * var(--sm) * 1px)!important;height:calc(26 * var(--sm) * 1px)!important}

  /* 상단 오버레이 — 브랜드 내비(왼쪽) / 언어 선택(오른쪽) 한 줄에 배치 */
  .herobar{
    top:calc(env(safe-area-inset-top,0px) + 16px)!important;
    padding:0 calc(18 * var(--sm) * 1px)!important;
    flex-direction:row;align-items:center;
  }
  .brandnav{gap:calc(16 * var(--sm) * 1px)}
  /* 손가락 탭 영역만 넓힌다 — 레이아웃과 롤 모션(overflow:hidden)은 그대로 */
  .brandnav button::after{content:"";position:absolute;inset:-12px -10px}
  .brandnav button{font-size:calc(15 * var(--sm) * 1px)!important}

  /* 언어 선택 — 네 개를 한 줄에 펼치면 브랜드명(언어마다 폭이 달라진다)과
     부딪히므로, 폭이 항상 같은 코드 버튼 하나로 접고 탭하면 목록을 연다.
     손가락 탭이 목적이라 목록의 각 줄은 44px 이상으로 잡는다. */
  .herobar .langtoggle{
    display:flex!important;position:relative;align-items:center;gap:calc(4 * var(--sm) * 1px);
    font-family:Pretendard,-apple-system,sans-serif;
    font-size:calc(13 * var(--sm) * 1px);font-weight:600;letter-spacing:.06em;color:#fff;
    padding:calc(7 * var(--sm) * 1px) calc(11 * var(--sm) * 1px);
    border:1px solid rgba(255,255,255,.55);border-radius:999px;
    background:rgba(0,0,0,.14);line-height:1;white-space:nowrap;
  }
  .herobar .langtoggle em{font-style:normal;font-size:calc(9 * var(--sm) * 1px);opacity:.8}
  .herobar .langtoggle::after{content:"";position:absolute;inset:-10px}   /* 탭 영역 확대 */

  .langs{
    position:absolute;top:calc(100% + 10px);right:0;z-index:30;
    flex-direction:column;align-items:stretch;gap:0;
    min-width:calc(132 * var(--sm) * 1px);padding:calc(6 * var(--sm) * 1px);
    border-radius:calc(14 * var(--sm) * 1px);
    background:rgba(18,18,18,.92);backdrop-filter:blur(10px);
    box-shadow:0 12px 34px rgba(0,0,0,.34);
    opacity:0;transform:translateY(-6px) scale(.97);pointer-events:none;
    transition:opacity 180ms ease,transform 220ms var(--e-soft);
    text-shadow:none;
  }
  .langbox.open .langs{opacity:1;transform:none;pointer-events:auto}
  .langs button{
    font-size:calc(14 * var(--sm) * 1px)!important;
    justify-content:flex-start!important;
    min-height:calc(44 * var(--sm) * 1px);
    padding:0 calc(12 * var(--sm) * 1px)!important;
    border-bottom:none!important;border-radius:calc(9 * var(--sm) * 1px);
    opacity:.62;
  }
  .langs button.on{opacity:1;background:rgba(255,255,255,.14)}

  /* 스크롤 표시 — 브랜드 바 안이 너무 좁아 화면 하단 중앙에 고정 */
  .cue{
    left:50%!important;right:auto!important;top:auto!important;
    transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom,0px) + 18px)!important;
    flex-direction:row-reverse;gap:calc(10 * var(--sm) * 1px);
  }
  .cue i{width:calc(9 * var(--sm) * 1px);height:calc(30 * var(--sm) * 1px);flex:none}
  .cue i b{width:calc(9 * var(--sm) * 1px);height:calc(9 * var(--sm) * 1px)}
  .cue span{font-size:calc(11 * var(--sm) * 1px)!important;letter-spacing:.18em!important}

  /* 데스크톱 키프레임(translateY 800%/1600%)은 트랙이 크고 점이 14px일 때
     맞춘 값이라, 모바일처럼 트랙 30px·점 9px로 줄이면 그 비율 그대로는
     트랙 밖까지 튀어나간다. 같은 이름으로 다시 선언해 이 구간에서만
     교체한다 — 점 자신의 높이(9px) 기준 233%(=트랙-점 간격 21px)가
     정확히 트랙 안쪽 끝까지만 닿는 값. */
  @keyframes cuedot{
    0%,8%    {transform:translateY(0) scale(1,1);filter:blur(0);
              animation-timing-function:cubic-bezier(.55,0,.85,.35)}
    30%      {transform:translateY(117%) scale(.66,1.66);filter:blur(.5px)}
    46%      {transform:translateY(233%) scale(1.22,.8);filter:blur(0);
              animation-timing-function:cubic-bezier(.18,.9,.32,1)}
    54%      {transform:translateY(233%) scale(1,1);
              animation-timing-function:cubic-bezier(.55,0,.85,.35)}
    74%      {transform:translateY(117%) scale(.66,1.66);filter:blur(.5px)}
    90%      {transform:translateY(0) scale(1.18,.84);filter:blur(0);
              animation-timing-function:cubic-bezier(.18,.9,.32,1)}
    100%     {transform:translateY(0) scale(1,1)}
  }

  /* 마지막 문구 화면 — 이미지 3장이 전체화면으로 다 나온 뒤, 한 번 더 스크롤해야
     나오는 완전히 별도의 흰 화면. 사진 위에 겹치지 않도록 이미지 뷰를 위로
     밀어내고 그 자리에 이 화면이 아래에서 올라와 교체된다(오버레이 아님). */
  .s4{
    position:fixed!important;inset:0!important;top:0!important;bottom:auto!important;
    height:100dvh!important;width:100%!important;
    background:#fff;
    padding:0 calc(28 * var(--sm) * 1px);
    justify-content:center;gap:calc(34 * var(--sm) * 1px);
    transform:translateY(var(--slideY,100dvh));
    z-index:20;
  }
  .s4-h{font-size:calc(23 * var(--sm) * 1px)!important;line-height:1.24!important;color:#111!important}
  .s4-p{
    font-size:calc(13 * var(--sm) * 1px)!important;
    line-height:calc(19 * var(--sm) * 1px)!important;
    white-space:normal!important;color:#111!important;opacity:.7!important;
  }

  .topbar .menu{
    right:calc(env(safe-area-inset-right,0px) + 16px)!important;
    top:calc(env(safe-area-inset-top,0px) + 16px)!important;
    font-size:calc(13 * var(--sm) * 1px)!important;
    padding:calc(11 * var(--sm) * 1px) calc(20 * var(--sm) * 1px)!important;
  }
  .counter{
    right:calc(env(safe-area-inset-right,0px) + 16px)!important;
    bottom:calc(env(safe-area-inset-bottom,0px) + 14px)!important;
    font-size:calc(10 * var(--sm) * 1px)!important;
  }
}
</style>

<body>

<script>
(() => {
  const stage   = document.getElementById('stage');
  const panels  = [...document.querySelectorAll('.panel')];
  const counter = document.getElementById('counter');
  const s4      = document.getElementById('s4');


  /* 로고 조각 — 폭/오프셋 모두 %라 화면 크기가 바뀌어도 그대로 맞음 */
  const SLICES = 64;
  document.querySelectorAll('.logo').forEach(el => {
    const src = el.dataset.src;
    el.style.setProperty('--src', `url("${src}")`);
    for (let i = 0; i < SLICES; i++) {
      const cell = document.createElement('span');
      cell.className = 'sl';
      cell.style.setProperty('--i', i);
      const inner = document.createElement('i');
      inner.style.backgroundImage = `url("${src}")`;
      cell.appendChild(inner);
      el.appendChild(cell);
    }
  });

  /* 문구 — 글자 단위로 쪼갬. <br>은 그대로 둔다 */
  /* 파도 모션 때문에 글자를 하나씩 쪼개는데, 예전엔 공백까지 &nbsp; 로 바꿔
     넣어 "공백에서는 절대 안 끊기고 단어 중간에서만 끊기는" 상태였다
     (영어에서 adva/nced 처럼 잘림). 라틴 단어는 한 덩어리로 묶어 안 쪼개지게
     하고, 공백은 진짜 공백으로 둬서 거기서 줄이 바뀌게 한다.
     한중일은 원래 글자 단위로 끊는 게 맞으므로 그대로 낱자로 둔다. */
  const LATIN = /[A-Za-z0-9''’\-–—.&]+/g;
  function splitDesc(p){
    const out = document.createDocumentFragment();
    const chip = c => {
      const ch = document.createElement('span');
      ch.className = 'ch';
      ch.textContent = c;
      return ch;
    };
    const loose = str => {
      for (const c of str) {
        if (c === ' ') out.appendChild(document.createTextNode(' '));
        else out.appendChild(chip(c));
      }
    };
    [...p.childNodes].forEach(node => {
      if (node.nodeType === 1) { out.appendChild(node.cloneNode(true)); return; }
      const text = node.textContent;
      let at = 0;
      for (const m of text.matchAll(LATIN)) {
        loose(text.slice(at, m.index));
        const w = document.createElement('span');
        w.className = 'w';
        for (const c of m[0]) w.appendChild(chip(c));
        out.appendChild(w);
        at = m.index + m[0].length;
      }
      loose(text.slice(at));
    });
    p.textContent = '';
    p.appendChild(out);
  }
  document.querySelectorAll('.desc, .s4-h, .s4-p').forEach(splitDesc);

  /* 파도 순번은 실제로 렌더된 줄 기준. 줄마다 0부터 다시 세서
     여러 줄이 한 줄기 물결에 실리고, 줄 수가 바뀌어도 그대로 맞는다. */
  function indexChars(){
    document.querySelectorAll('.desc, .s4-h, .s4-p').forEach(p => {
      let top = null, i = 0;
      p.querySelectorAll('.ch').forEach(ch => {
        const t = ch.offsetTop;
        if (top === null || Math.abs(t - top) > 2) { top = t; i = 0; }
        ch.style.setProperty('--i', i++);
      });
    });
  }

  const vw  = px => (px / 1920 * 100) + 'vw';
  const pc  = px => (px / 1080 * 100) + '%';
  /* transform: translateY(%) 는 부모가 아니라 "자기 자신의 높이" 기준이라
     패널마다 높이가 다른 모바일 스택에서는 % 를 쓸 수 없다.
     데스크톱이 vw(뷰포트 기준 절대 단위)로 translateX 를 안전하게 쓰듯,
     모바일은 dvh(뷰포트 기준)로 translateY 를 써야 패널 높이와 무관하게 맞는다. */
  const dvh = px => (px / 1080 * 100) + 'dvh';

  /* hero 3단 peek — 자리(slot)별 값, 브랜드와 무관 */
  /* 피그마 메인페이지(15:142) 실측 — 자리별 사진 박스 */
  /* 피그마 메인페이지(19:325) 실측 — 피더린 1285 / 바루랩 406 / 탐뷰티 229 */
  const HERO = [
    {x:0,    w:1285, by:0,   bh:723},
    {x:1285, w:406,  by:349, bh:507},
    {x:1691, w:229,  by:614, bh:374},
  ];
  const ACTIVE_W = 1285, PEEK_W = 635;

  /* 모바일 — 가로 폭(x/w) 대신 세로 높이(y/h)로 축만 바꾼 대응표.
     비율은 데스크톱 것을 재사용하지 않고 모바일 전용으로 지정한다:
     첫 화면(3단) = 6:3:1, 스크롤 후 활성/다음 브랜드 = 7:3.
     색 배경이 보이지 않도록 by=0,bh=1080(=0%/100%) 고정 —
     사진이 항상 슬롯을 빈틈없이 꽉 채운다. */
  const MOBILE_HERO = [ {y:0,   h:648}, {y:648, h:324}, {y:972, h:108} ];  // 6:3:1
  const M_ACTIVE_H = 756, M_PEEK_H = 324;                                  // 7:3

  const mq = matchMedia('(max-width:820px)');
  let isMobile = mq.matches;

  let state = 0, locked = false;

  /* 마지막 슬라이드(탐뷰티) -> 좌측 이미지 컬럼(피그마 15:224) 연속 변형.
     tp 0 = 브랜드 전체 프레임 / tp 1 = 컬럼 완성.
     이미지가 아래에서 차오르며 로고·문구 영역을 화면 밖으로 밀어낸다. */
  const last = document.querySelector('.panel.is-last');
  const TP_SPAN = 1400;                  // 끝까지 가는 데 필요한 휠 이동량(px)
  let tp = 0, tpTarget = 0, tpRAF = null, tpUp = 0;

  const lerp   = (a, b, t) => a + (b - a) * t;
  const clamp  = t => t < 0 ? 0 : t > 1 ? 1 : t;
  const smooth = t => t * t * (3 - 2 * t);
  const phase  = (t, a, b) => smooth(clamp((t - a) / (b - a)));

  function applyTP(){
    if (!last) return;

    /* 마지막 슬라이드가 아닐 때는 변형 값을 걷어내고 layout() 에 맡긴다.
       (이게 없으면 초기화 때 탐뷰티 밴드가 활성 크기 1285x723 으로 덮여
        메인 화면의 229x374 칸 안에서 비율이 어긋나 보였다) */
    if (state !== 3) {
      last.classList.remove('morphing');
      last.style.removeProperty('--wf');
      last.style.setProperty('--fo', 0);
      last.querySelector('.e2').style.height = '0%';
      last.querySelector('.e3').style.height = '0%';
      const b0 = last.querySelector('.label');
      /* --bar-top/--bar-h 는 layout() 이 band 와 짝지어 항상 새로 정하므로
         여기서 지우면 안 된다 — 지우면 CSS 기본값(데스크톱 수치)으로
         되돌아가 band 와 어긋나며 로고·문구·화살표 공간이 좁아진다. */
      b0.style.setProperty('--ly', '0px');
      b0.style.pointerEvents = '';
      s4.classList.remove('on');
      return;
    }

    const pct = v => (v / 1080 * 100) + '%';
    const band = last.querySelector('.band');
    const e2 = last.querySelector('.e2'), e3 = last.querySelector('.e3');
    const bar = last.querySelector('.label');
    last.classList.toggle('morphing', tp > 0 || tp2 > 0);
    last.style.setProperty('--fo', clamp(tp / .12));   // 비워지는 자리는 흰 바닥

    if (isMobile) {
      /* 모바일: 3단계.
         0~.45  탐뷰티 패널 자체가 70%(활성 슬롯) -> 100%(전체화면)로 자란다
                — 이 구간엔 사진 한 장 그대로, 아직 나뉘지 않는다.
         .35~.85 다 자란 화면을 세 장으로 등분한다(겹치는 구간을 둬서 자연스럽게 이어짐)
         .8~1    다 채워진 이미지 위로 마지막 문구가 하단에서 오버레이로 떠오른다 */
      /* phase() 자체가 이미 가감속(smooth)을 포함한다 — 여기에 smooth 를 한 번
         더 씌우면 이중으로 눌려 초반이 거의 멈춘 것처럼 보인다(빈 바닥이 길어짐). */
      const grow  = phase(tp, 0, .8);   // 이미지가 채워지는 속도에 맞춰 늘어나야 빈 바닥이 안 생긴다
      const hf    = lerp(M_ACTIVE_H / 1080, 1, grow);        // 패널 자기 높이(스테이지 기준 %)
      last.style.setProperty('--hf', (hf * 100) + '%');

      /* bandFr 은 평소 활성 슬롯의 이미지 비율(650/1080)에서 시작해야 한다.
         1에서 시작하면 tp=0(스크롤 전 방금 도착한 상태)에 로고·문구·아이콘이
         있는 브랜드 바가 비율 0으로 접혀 사라져 보이는 버그가 생긴다. */
      const third = 1 / 3;
      const baseBand = 570 / 1080;   // layout() 의 bh 값(브랜드 바 여백 확보용)과 항상 맞춘다
      const bandFr = lerp(baseBand, third, phase(tp, .08, .8));
      /* 다음 두 장은 첫 칸이 줄기 시작하면 곧바로 따라 들어온다 — 사이가
         벌어지면 빈 바닥이 드러난다 */
      const e2Fr   = lerp(0, third, phase(tp, .12, .86));
      const e3Fr   = lerp(0, third, phase(tp, .24, .94));

      band.style.setProperty('--by', '0%');
      band.style.setProperty('--bh', (bandFr * 100) + '%');
      e2.style.top = (bandFr * 100) + '%';               e2.style.height = (e2Fr * 100) + '%';
      e3.style.top = ((bandFr + e2Fr) * 100) + '%';      e3.style.height = (e3Fr * 100) + '%';

      const barH = 1 - bandFr;
      bar.style.setProperty('--bar-top', (bandFr * 100) + '%');
      bar.style.setProperty('--bar-h',   (barH * 100) + '%');
      /* 브랜드 바가 이미지보다 먼저 빠지면 그 아래가 흰 바닥으로 드러난다.
         다음 두 장이 채워 들어오는 속도에 맞춰 천천히 물러나게 한다. */
      /* 바는 밀어내지 않는다 — 위 .ext z-index 조정으로 이미지가 바를 덮으며
         내려오므로, 바가 비켜줄 필요가 없고 빈 바닥도 생기지 않는다 */
      bar.style.setProperty('--ly', '0px');
      bar.style.pointerEvents = tp > .05 ? 'none' : '';

      s4.classList.toggle('on', tp > .8);
    } else {
      const e = smooth(tp);
      /* 세 칸이 같은 높이를 공유한다 -> 언제나 맞붙어 있고 함께 작아진다.
         723(한 장만 보이는 상태) -> 360(세 장이 화면을 정확히 채우는 상태) */
      const h = lerp(723, 360, e);
      const W = lerp(1285, 639, e);

      last.style.setProperty('--wf', (W / 1920 * 100) + 'vw');
      band.style.setProperty('--bh',  pct(h));
      band.style.setProperty('--bw',  (W / 1920 * 100) + 'vw');
      band.style.setProperty('--opy', lerp(50, 40.9, e) + '%');

      /* 바루랩·피더린은 첫 칸 바로 밑에 이어 붙는다 */
      e2.style.top = pct(h);      e2.style.height = pct(h);
      e3.style.top = pct(h * 2);  e3.style.height = pct(h);

      /* 브랜드 바: 첫 칸 아래를 덮고 있다가 통째로 위로 올라가 이미지 뒤로 숨는다 */
      const barH = 1080 - h;
      bar.style.setProperty('--bar-top', pct(h));
      bar.style.setProperty('--bar-h',   pct(barH));
      bar.style.setProperty('--ly',      pct(-barH * phase(tp, 0, .5)).replace('%','vh'));
      bar.style.pointerEvents = tp > .05 ? 'none' : '';

      s4.classList.toggle('on', tp > .72);
    }

    counter.style.opacity = tp > .05 ? '0' : '';
    const r = last.querySelector('.roll');
    if (r && tp > .02) rollStop(r);
  }

  function tpDraw(){
    tp += (tpTarget - tp) * 0.14;
    if (Math.abs(tpTarget - tp) < 0.002) tp = tpTarget;
    applyTP();
    tpRAF = (tp === tpTarget) ? null : requestAnimationFrame(tpDraw);
  }
  function tpKick(){ if (!tpRAF) tpRAF = requestAnimationFrame(tpDraw); }
  function tpReset(){ tpStop(); tp = tpTarget = tpUp = 0; tp2Reset(); applyTP(); }

  /* 모바일 스냅 전용 — 시간 기반 트윈.
     tpDraw 의 감쇠 보간(0.14)은 스크롤을 따라다닐 때는 맞지만, 한 번에
     끝까지 보내는 스냅에는 처음이 확 튀고 끝이 늘어져 강약이 살지 않는다.
     정해진 시간 동안 가감속 곡선으로 움직여 모션을 읽을 수 있게 한다. */
  const easeInOut = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
  const TW_TP  = 1600;   // 이미지가 전체화면으로 자라 3장으로 나뉘는 구간
  const TW_TP2 = 1100;   // 이미지 화면 <-> 흰 문구 화면 교체
  let tpTw = null, tp2Tw = null;
  function tpStop(){ if (tpTw) cancelAnimationFrame(tpTw); tpTw = null;
                     if (tpRAF) cancelAnimationFrame(tpRAF); tpRAF = null; }
  function tp2Stop(){ if (tp2Tw) cancelAnimationFrame(tp2Tw); tp2Tw = null;
                      if (tp2RAF) cancelAnimationFrame(tp2RAF); tp2RAF = null; }
  function tpTo(to, dur){
    tpStop();
    const from = tp, t0 = performance.now();
    tpTarget = to;
    (function step(now){
      const k = Math.min(1, (now - t0) / dur);
      tp = lerp(from, to, easeInOut(k));
      applyTP();
      tpTw = k < 1 ? requestAnimationFrame(step) : null;
    })(t0);
  }
  function tp2To(to, dur){
    tp2Stop();
    const from = tp2, t0 = performance.now();
    tp2Target = to;
    (function step(now){
      const k = Math.min(1, (now - t0) / dur);
      tp2 = lerp(from, to, easeInOut(k));
      applyTP2();
      tp2Tw = k < 1 ? requestAnimationFrame(step) : null;
    })(t0);
  }

  /* 모바일 전용 2단계 — 이미지 3장이 전체화면으로 다 자란(tp=1) 뒤,
     한 번 더 스크롤해야 흰 문구 화면이 아래에서 올라와 이미지 화면을 교체한다.
     이미지와 문구가 동시에 보이는 상태가 없도록 이미지 뷰가 위로 밀려 나가는
     만큼만 문구 화면이 올라온다(서로 자리를 바꿔치기). */
  let tp2 = 0, tp2Target = 0, tp2RAF = null;
  function applyTP2(){
    if (!isMobile) return;
    const e = smooth(tp2);
    last.style.setProperty('--slideY', (-e * 100) + 'dvh');
    s4.style.setProperty('--slideY',   ((1 - e) * 100) + 'dvh');
    s4.classList.toggle('on', tp2 > .4);
    last.classList.toggle('morphing', tp > 0 || tp2 > 0);
  }
  function tp2Draw(){
    tp2 += (tp2Target - tp2) * 0.14;
    if (Math.abs(tp2Target - tp2) < 0.002) tp2 = tp2Target;
    applyTP2();
    tp2RAF = (tp2 === tp2Target) ? null : requestAnimationFrame(tp2Draw);
  }
  function tp2Kick(){ if (!tp2RAF) tp2RAF = requestAnimationFrame(tp2Draw); }
  function tp2Reset(){ tp2Stop(); tp2 = tp2Target = 0; if (last) applyTP2(); }

  function layout(){
    const scrolled = state > 0;
    stage.classList.toggle('scrolled', scrolled);
    const a = state - 1;
    if (state !== 3 && (tp !== 0 || tp2 !== 0)) tpReset();

    panels.forEach((p, i) => {
      let by, bh, slot;
      if (isMobile) {
        let y, h;
        if (!scrolled) {
          ({y, h} = MOBILE_HERO[i]); slot = 'hero';
        } else if (i <= a) {
          y = (i - a) * M_ACTIVE_H; h = M_ACTIVE_H; slot = 'full';
        } else {
          y = M_ACTIVE_H + (i - a - 1) * M_PEEK_H; h = M_PEEK_H; slot = 'peek';
        }
        /* 활성(메인) 슬롯만 데스크톱과 같은 비율(66.9%)로 이미지/브랜드 바를 나눠
           로고·문구·아이콘이 보일 공간을 남긴다. 다음 브랜드가 보이는 미리보기(peek)
           슬롯과 첫 화면(hero) 3단은 텍스트가 없으므로 이미지가 슬롯을 항상 꽉 채운다. */
        if (slot === 'full') { by = 0; bh = 570; }   // 브랜드 바 세로 여백 확보(로고+문구+버튼이 빠듯해 더 키움)
        else { by = 0; bh = 1080; }
        p.style.setProperty('--y', dvh(y));
        p.style.setProperty('--hf', pc(h));
      } else {
        let x, w;
        if (!scrolled) {
          ({x, w, by, bh} = HERO[i]); slot = 'hero';
        } else if (i <= a) {
          /* 활성 + 왼쪽으로 빠지는 것들: 모양을 바꾸지 않고 통째로 밀려나간다 */
          x = (i - a) * ACTIVE_W; w = ACTIVE_W; by = 0; bh = 723; slot = 'full';
        } else {
          x = ACTIVE_W + (i - a - 1) * PEEK_W; w = PEEK_W;
          by = 247; bh = 586; slot = 'peek';
        }
        p.style.setProperty('--x', vw(x));
        p.style.setProperty('--bw', vw(w));
      }
      const active = scrolled && i === a;

      const band = p.querySelector('.band');
      band.style.setProperty('--by', pc(by));
      band.style.setProperty('--bh', pc(bh));

      /* 라벨(브랜드 바)의 위치·높이를 band 와 항상 같은 값으로 맞춘다.
         예전엔 CSS 기본값(66.944%/33.056%, 데스크톱 수치)에 기대고 있었는데,
         모바일에서 이미지 비율(bh)을 다른 값으로 바꿔도 라벨은 그 기본값
         그대로 남아 있어 로고·문구·화살표가 들어갈 공간이 실제보다 좁아지는
         버그가 있었다. band 와 라벨이 항상 짝을 이루도록 여기서 함께 정한다. */
      const label = p.querySelector('.label');
      label.style.setProperty('--bar-top', pc(bh));
      label.style.setProperty('--bar-h',   pc(1080 - bh));

      const cs = getComputedStyle(p);
      band.style.setProperty('--opy', (cs.getPropertyValue('--opy-' + slot) || '50%').trim());
      band.style.setProperty('--opx', (cs.getPropertyValue('--opx-' + slot) || '50%').trim());

      p.classList.toggle('is-active', active);

      /* 파도(300ms 지연 + 63*3ms 스태거 + 840ms)가 끝나면 원본 로고로 교체 */
      const lg = p.querySelector('.logo');
      if (lg) {
        clearTimeout(lg._t);
        if (active) lg._t = setTimeout(() => lg.classList.add('settled'), 1400);
        else lg.classList.remove('settled');
      }
      const v = p.querySelector('video');
      if (v) { active ? v.play().catch(() => {}) : v.pause(); }
      const r = p.querySelector('.roll');
      if (r) { active ? rollStart(r) : rollStop(r); }
    });

    counter.textContent = scrolled ? String(a + 1).padStart(2,'0') + ' / 03' : '';
  }

  /* 이미지 롤(바루랩·탐뷰티) — 메인으로 올라왔을 때만 재생.
     비활성 상태에서는 첫 장(기본 메인 이미지)에서 정지.
     멈춤 1.38s + 이동 0.62s = 컷당 2초.
     이징은 앞이 아주 완만하고 뒤에서 확 당겨지는 곡선 — 슬며시 밀리다 훅 넘어간다. */
  const R_HOLD = 1380, R_MOVE = 620, R_EASE = 'cubic-bezier(.9,0,.25,1)';
  const rolls = new Map();                                   // .roll -> 재생 상태
  document.querySelectorAll('.roll').forEach(el => rolls.set(el,
    { i:0, n: el.children.length - 1, timer:null, resetT:null }));   // n: 복제본 제외

  function rollReset(el){
    const s = rolls.get(el);
    s.i = 0;
    el.style.transition = 'none';
    el.style.transform  = 'translateY(0%)';
  }
  function rollStop(el){
    const s = rolls.get(el);
    clearTimeout(s.startT);
    if (s.timer) { clearInterval(s.timer); s.timer = null; }
    // 정지 화면으로 넘어가는 페이드가 끝난 뒤에 되감아야 첫 장으로 튀지 않는다
    clearTimeout(s.resetT);
    s.resetT = setTimeout(() => rollReset(el), 460);
  }
  function rollStart(el){
    const s = rolls.get(el);
    clearTimeout(s.resetT);
    if (s.timer) return;
    const step = () => {
      s.i++;
      el.style.transition = `transform ${R_MOVE}ms ${R_EASE}`;
      el.style.transform  = `translateY(${-s.i * 100}%)`;
      if (s.i === s.n) setTimeout(() => rollReset(el), R_MOVE + 20);
    };
    // 브랜드가 메인으로 올라오는 즉시 첫 전환이 시작되도록 —
    // setInterval 은 첫 실행 전에도 항상 한 주기(R_HOLD+R_MOVE)를 기다리므로
    // 첫 스텝만 짧게 예약하고, 이후는 정상 주기로 이어간다.
    s.startT = setTimeout(step, 60);
    s.timer = setInterval(step, R_HOLD + R_MOVE);
  }

  function go(next){
    next = Math.max(0, Math.min(3, next));
    if (next === state || locked) return;
    state = next; locked = true;
    document.getElementById('langbox').classList.remove('open');
    layout();
    applyTP();   // 탐뷰티로 막 넘어왔을 때 라벨 바가 방금 계산과 어긋나지 않도록 즉시 동기화
    setTimeout(() => { locked = false; }, 700);
  }

  /* 한 번 튕기면 한 칸만 넘어가되, 계속 굴릴 때 멈춰 서지 않게.
     넘어간 직후에는 다음 칸까지 필요한 양을 크게 잡아 관성 꼬리를 흡수하고,
     휠이 잠깐 쉬면 원래 감도로 돌아온다. (이전엔 아예 입력을 막아서
     '어떤 영역은 스크롤이 안 먹는다'처럼 느껴졌다) */
  const STEP = 60, STEP_CONT = 260;
  let acc = 0, idleT = null, fresh = true;

  /* 휠·터치 공통 처리. deltaY 부호는 휠과 동일하게 맞춰서 넘긴다
     (아래로 스크롤 = 양수 = 다음으로 진행). */
  function handleScroll(deltaY){
    if (locked) return;

    if (state === 3 && isMobile) {
      /* 모바일 3단계: 스크롤량에 비례해 어중간한 중간 상태에 멈추지 않도록,
         브랜드 전환(go())과 똑같이 "한 번 스크롤 = 한 단계 완전히 진행"으로
         만든다. 문턱값(STEP)만 넘으면 tp/tp2 를 곧장 0 또는 1로 스냅시키고,
         거기까지 부드럽게 움직이는 애니메이션은 그대로 rAF 보간에 맡긴다 —
         스크롤 위치에 실시간으로 붙어 다니다가 애매하게 잘려 보이던 문제 해결. */
      acc += deltaY;
      if (Math.abs(acc) < STEP) return;
      const dir = Math.sign(acc);
      acc = 0;
      /* 모션이 다 끝날 때까지 다음 입력을 받지 않는다 — 중간에 다음 단계가
         겹쳐 들어오면 한 번에 두 단계가 지나간 것처럼 보인다 */
      const hold = d => { locked = true; setTimeout(() => { locked = false; }, d + 120); };

      if (dir > 0) {                              // 아래로 스크롤 = 다음 단계
        if (tp < 1)      { hold(TW_TP);  tpTo(1, TW_TP); }
        else if (tp2 < 1){ hold(TW_TP2); tp2To(1, TW_TP2); }
      } else {                                    // 위로 스크롤 = 이전 단계
        if (tp2 > 0)     { hold(TW_TP2); tp2To(0, TW_TP2); }
        else if (tp > 0) { hold(TW_TP);  tpTo(0, TW_TP); }
        else             { go(state - 1); }
      }
      return;
    } else if (state === 3) {
      /* 데스크톱 — 기존 그대로 */
      if (!fresh) {
        acc += deltaY;
        if (Math.abs(acc) < STEP_CONT) return;
        acc = 0; fresh = true;
      }
      if (deltaY > 0) {
        if (tpTarget >= 1) return;
        tpTarget = clamp(tpTarget + deltaY / TP_SPAN);
        tpKick(); return;
      }
      if (tpTarget > 0) {
        tpTarget = clamp(tpTarget + deltaY / TP_SPAN);
        if (tpTarget === 0) fresh = false;
        tpKick(); return;
      }
    }

    acc += deltaY;
    if (Math.abs(acc) < (fresh ? STEP : STEP_CONT)) return;
    const dir = Math.sign(acc);
    acc = 0; fresh = false;
    go(state + dir);
  }

  addEventListener('wheel', e => {
    e.preventDefault();
    if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;   // 가로 스와이프는 무시
    clearTimeout(idleT);
    idleT = setTimeout(() => { acc = 0; fresh = true; }, 140);
    handleScroll(e.deltaY);
  }, {passive:false});

  /* 터치 — 손가락 이동량을 휠의 deltaY 와 같은 단위로 변환해 그대로 넘긴다.
     예전엔 46px 넘으면 무조건 한 칸 점프만 했어서 tp/tp2 단계(이미지 확대,
     전체화면 정리, 문구 전환)를 손가락으로는 아예 밟을 수 없었다. */
  let ty = null;
  addEventListener('touchstart', e => {
    ty = e.touches[0].clientY;
    clearTimeout(idleT);
    idleT = setTimeout(() => { acc = 0; fresh = true; }, 140);
  }, {passive:true});
  addEventListener('touchmove', e => {
    if (ty === null) return;
    const y = e.touches[0].clientY;
    const d = (ty - y) * 1.8;   // 손가락 이동은 휠 델타보다 작으므로 감도 보정
    ty = y;
    clearTimeout(idleT);
    idleT = setTimeout(() => { acc = 0; fresh = true; }, 140);
    handleScroll(d);
  }, {passive:true});
  addEventListener('touchend', () => { ty = null; });

  addEventListener('keydown', e => {
    if (['ArrowDown','PageDown',' '].includes(e.key)) { e.preventDefault(); go(state + 1); }
    if (['ArrowUp','PageUp'].includes(e.key))          { e.preventDefault(); go(state - 1); }
    if (e.key === 'Home') go(0);
  });
  document.getElementById('menu').addEventListener('click', () => go(0));

  /* ---------- 언어 ----------
     브랜드명은 고유명사라 번역하지 않고 각 언어권 표기만 맞춘다. */
  const I18N = {
    ko:{b1:'피더린',b2:'바루랩',b3:'탐뷰티',scroll:'스크롤'},
    en:{b1:'PYDERIN',b2:'BARULAB',b3:'TAM BEAUTY',scroll:'SCROLL'},
    zh:{b1:'PYDERIN',b2:'BARULAB',b3:'TAM BEAUTY',scroll:'滚动'},
    ja:{b1:'PYDERIN',b2:'BARULAB',b3:'TAM BEAUTY',scroll:'スクロール'},
  };
  const DESC = {

      barulab:'바루랩은 20년 피부과학 연구와 비건·저자극 <br class="b3">성분을 바탕으로, <br class="b2">피부를 바로 잡는 데 집중하는 <br class="b3">스킨케어 전문 브랜드입니다.',
      tam:'탐뷰티는 식물 유래 원료와 친환경 공법을 바탕으로,<br>클린 뷰티에 특화된 코스메틱 라이프스타일 브랜드입니다.',
    },
    en:{
      pyderin:'Built on medical expertise and ingredient transparency,<br>a PDRN specialist focused on true skin recovery.',
      barulab:'Twenty years of skin science, vegan and low-irritant,<br>a skincare brand devoted to setting skin right.',
      tam:'Rooted in plant-derived ingredients and clean processes,<br>a clean-beauty cosmetic lifestyle brand.',
    },
    zh:{
      pyderin:'以医疗专业与成分透明为基础，<br>专注肌肤自我修复的 PDRN 专业品牌。',
      barulab:'以二十年皮肤科学研究与纯素低刺激成分为基础，<br>专注于调理肌肤的护肤专业品牌。',
      tam:'以植物来源原料与环保工艺为基础，<br>专注纯净美妆的化妆品生活方式品牌。',
    },
    ja:{
      pyderin:'医療の専門性と成分の透明性をもとに、<br>肌本来の回復に向き合うPDRN専門ブランドです。',
      barulab:'20年の皮膚科学研究とヴィーガン・低刺激成分をもとに、<br>肌を整えることに集中するスキンケアブランドです。',
      tam:'植物由来の原料と環境にやさしい製法をもとに、<br>クリーンビューティーに特化したブランドです。',
    },
  };
  /* 마지막 화면 하단 문구 — 헤드라인은 영문 고정, 이 문단만 번역 */
  const S4 = {
    ko:'안티에이징을 위한 PDRN,<br>'
      +'자연에서 찾은 순수 클린 뷰티,<br>'
      +'그리고 최첨단 바이오 기술까지.<br><br>'
      +'피더린, 바루랩, 탐뷰티는 프로페셔널 뷰티 업계의 가능성을<br>'
      +'확장하는 세 가지 대표 브랜드입니다.<br><br>'
      +'이들은 각자의 영역에서 쌓아온 전문성으로 고객 한 분 한 분의 특별한 니즈에 맞는 뷰티 솔루션을 제안합니다.<br>'
      +'광범위한 포트폴리오 안에서 최적의 제품을 찾을 수 있도록,<br>'
      +'맞춤형 선택지를 제공하는 것이 우리의 역할이자 가치입니다.',
    /* 한국어와 같은 호흡으로 끊는다 — 1문단은 세 구절을 각 줄에, 2문단은 두 줄,
       3문단은 긴 문장 하나 + 두 줄. 줄이 의미 단위로 떨어지게 직접 나눈 값이라
       번역문을 고칠 때 줄바꿈 위치도 같이 봐야 한다. */
    en:'PDRN for anti-aging,<br>'
      +'pure clean beauty found in nature,<br>'
      +'and advanced bio technology.<br><br>'
      +'PYDERIN, BARULAB and TAM BEAUTY are three brands<br>'
      +'expanding what professional beauty can do.<br><br>'
      +'With the expertise each has built in its own field, they propose beauty solutions for every individual need.<br>'
      +'Offering tailored choices within a broad portfolio<br>'
      +'is our role and our value.',
    zh:'用于抗衰老的 PDRN、<br>'
      +'源自自然的纯净美妆，<br>'
      +'以及尖端生物技术。<br><br>'
      +'PYDERIN、BARULAB 与 TAM BEAUTY 是<br>'
      +'拓展专业美妆产业可能性的三大代表品牌。<br><br>'
      +'它们以各自领域积累的专业，为每一位顾客提出契合其需求的美妆方案。<br>'
      +'在广泛的产品组合中提供量身定制的选择，<br>'
      +'正是我们的角色与价值。',
    ja:'アンチエイジングのための PDRN、<br>'
      +'自然から見つけたピュアなクリーンビューティー、<br>'
      +'そして最先端のバイオ技術まで。<br><br>'
      +'PYDERIN、BARULAB、TAM BEAUTY は<br>'
      +'プロフェッショナルビューティー業界の可能性を広げる3つのブランドです。<br><br>'
      +'それぞれの領域で培った専門性で、お客様一人ひとりのニーズに合う提案をします。<br>'
      +'幅広いポートフォリオの中から最適な選択肢を届けることが、<br>'
      +'私たちの役割であり価値です。',
  };

  const BRANDKEY = p => p.classList.contains('b-pyderin') ? 'pyderin'
                      : p.classList.contains('b-barulab') ? 'barulab' : 'tam';

  function setLang(l){
    document.documentElement.lang = l;
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const t = I18N[l][el.dataset.i18n];
      if (!t) return;
      const dbl = el.querySelectorAll('i');          // 호버용으로 두 벌 겹친 것
      if (dbl.length === 2) dbl.forEach(n => n.textContent = t);
      else el.textContent = t;
    });
    panels.forEach(p => {
      const d = p.querySelector('.desc');
      d.innerHTML = DESC[l][BRANDKEY(p)];
      splitDesc(d);                       // 글자 단위 파도 다시 준비
    });
    const sp = document.querySelector('.s4-p');
    sp.innerHTML = S4[l];
    splitDesc(sp);
    indexChars();
    document.querySelectorAll('#langs button').forEach(b =>
      b.classList.toggle('on', b.dataset.lang === l));
    langcode.textContent = {ko:'KO', en:'EN', zh:'ZH', ja:'JA'}[l];
    langbox.classList.remove('open');
  }
  const langbox = document.getElementById('langbox');
  const langcode = document.getElementById('langcode');
  document.getElementById('langtoggle').addEventListener('click', e => {
    e.stopPropagation();
    langbox.classList.toggle('open');
    e.currentTarget.setAttribute('aria-expanded', langbox.classList.contains('open'));
  });
  document.getElementById('langs').addEventListener('click', e => {
    const b = e.target.closest('button[data-lang]');
    if (b) setLang(b.dataset.lang);
  });
  /* 목록 밖을 누르면 닫는다 */
  addEventListener('pointerdown', e => {
    if (!e.target.closest('#langbox')) langbox.classList.remove('open');
  });

  /* 브랜드명 클릭 -> 해당 소개 화면으로 */
  document.querySelector('.brandnav').addEventListener('click', e => {
    const b = e.target.closest('button[data-go]');
    if (b) { tpReset(); go(+b.dataset.go); }
  });




  const fit = () => {
    document.documentElement.style.setProperty(
      '--s', Math.min(innerWidth / 1920, innerHeight / 1080));
    document.documentElement.style.setProperty(
      '--sm', Math.max(.82, Math.min(1.2, innerWidth / 430)));
  };
  const onResize = () => {
    isMobile = mq.matches;
    fit(); layout(); applyTP(); indexChars();
  };
  addEventListener('resize', onResize);
  mq.addEventListener ? mq.addEventListener('change', onResize) : mq.addListener(onResize);
  fit();
  indexChars();

  setLang('ko');

  layout();
  applyTP();
})();
</script>
